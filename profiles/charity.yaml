label: Charity Leadership
db_path: charity_jobs.db
output_prefix: charity_
filters:
  minimum_score: 20
  salary_floor: 80000
  salary_target: 100000
  remote_salary_floor: 70000
sources:
  # CharityJob — server-rendered. Job-title links point at /jobs/<org>/<role>;
  # the old "h3 a" selector matches nothing now (the source had been silently
  # dry). a[href*='/jobs/'] catches the title links; nav/category links like
  # /jobs or /jobs/fundraising are dropped by the title_gate, and the
  # responsive mobile/desktop title duplicates collapse on URL dedup.
  - name: CharityJob CEO
    url: https://www.charityjob.co.uk/chief-executive-officer-jobs
    selector: "a[href*='/jobs/']"
  - name: CharityJob Director
    url: https://www.charityjob.co.uk/jobs?keywords=director+of+education+policy+programmes&category=director
    selector: "a[href*='/jobs/']"
  - name: NFP People
    url: https://careers.nfp-people.co.uk/jobs/
    selector: "a[href*='/job/']"
  # NFP Consulting — job cards are <article> elements with a single stretched
  # title link; the old ".job-title a" class is gone. Verified June 2026: 79.
  - name: NFP Consulting
    url: https://nfpconsulting.co.uk/jobs
    selector: "article a"
  #
  # --- Excluded charity sources (audited June 2026) ---
  #   - Prospectus (prospect-us.co.uk/job/) — returns HTTP 403 to automated
  #     requests (anti-bot), same as the Guardian Jobs exclusion.
  #   - Harris Hill (harrishill.co.uk) — /jobs/?category=… redirects to a
  #     JS-rendered /job-results page; vacancies are not in server HTML.
  #   - Third Sector Jobs (jobs.thirdsector.co.uk) — Madgex board now renders
  #     the results list client-side; server HTML has only category nav links.
weights:
  executive_bonus: 50
  director_bonus: 30
  permanent_signal: 20
  expertise_signal: 15
  sector_fit_bonus: 15
  salary_bonus: 30
  exclusion_penalty: -60
exec_titles:
  - chief executive
  - ceo
  - executive director
  - director general
  - chief executive officer
  - head of organisation
  - managing director
director_titles:
  - director of education
  - director of learning
  - director of policy
  - director of programmes
  - director of partnerships
  - director of impact
  - director of strategy
  - director of development
  - director of governance
  - director of quality
  # Sector-body / membership-org senior titles — Charles's CV maps strongly
  # onto skills, workforce, professional development, standards, membership
  # and accreditation roles in education-adjacent charities.
  - director of skills
  - director of workforce
  - director of professional development
  - director of standards
  - director of membership
  - director of credentials
  - director of accreditation
  - director of innovation
  - director of knowledge
  - director of research
  - head of education
  - head of policy
  - head of programmes
  - head of learning
  - head of partnerships
  - head of skills
  - head of professional development
  - head of standards
  - head of membership
title_gate:
  - chief executive
  - ceo
  - executive director
  - director general
  - director of
  - head of
  - managing director
  - chief operating
exclusion_terms:
  - software developer
  - software engineer
  - software architect
  - curriculum developer
  - policy developer
  - technician
  - warehouse
  - nurse
  - social worker
  - counsellor
  - therapist
  - support worker
  - community fundraiser
  - events coordinator
  - marketing officer
  - communications officer
  - fundraising manager
