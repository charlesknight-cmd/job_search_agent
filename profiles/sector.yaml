label: Sector Bodies & Professional Associations
db_path: sector_bodies_jobs.db
output_prefix: sector_
filters:
  minimum_score: 20
  salary_floor: 80000
  salary_target: 100000
  remote_salary_floor: 70000
sources:
  # jobs.ac.uk keyword search — see he.yaml for the full rationale (RSS retired,
  # taxonomy removed June 2026; keyword query must be in every request; title
  # link is the first <a> in .j-search-result__text → stable /job/<ID> URL).
  - name: jobs.ac.uk Director
    url: https://www.jobs.ac.uk/search/?keywords=director&sortOrder=1&pageSize=25&startIndex=1
    selector: ".j-search-result__text > a"
    pages: 3
  - name: jobs.ac.uk Chief Executive
    url: https://www.jobs.ac.uk/search/?keywords=chief+executive&sortOrder=1&pageSize=25&startIndex=1
    selector: ".j-search-result__text > a"
  # CharityJob — server-rendered; job-title links point at /jobs/<org>/<role>.
  # The old "h3 a" selector matches nothing now (see charity.yaml for detail).
  - name: CharityJob Policy
    url: https://www.charityjob.co.uk/jobs?keywords=director+policy+education+sector&category=policy-public-affairs
    selector: "a[href*='/jobs/']"
  - name: CharityJob Education
    url: https://www.charityjob.co.uk/jobs?keywords=director+education+learning&category=education
    selector: "a[href*='/jobs/']"
  - name: NFP People
    url: https://careers.nfp-people.co.uk/jobs/
    selector: "a[href*='/job/']"
  # Excluded (audited June 2026):
  #   - Guardian Jobs Education — returns 403 Forbidden (anti-bot blocking).
  #   - Prospectus (prospect-us.co.uk/job/) — also returns HTTP 403 to
  #     automated requests now; excluded for the same reason.
weights:
  executive_bonus: 50
  director_bonus: 35
  permanent_signal: 20
  expertise_signal: 20
  sector_fit_bonus: 20
  salary_bonus: 30
  exclusion_penalty: -60
exec_titles:
  - chief executive
  - ceo
  - executive director
  - director general
  - chief executive officer
  - managing director
  - registrar
director_titles:
  - director of education
  - director of learning
  - director of policy
  - director of quality
  - director of standards
  - director of professional standards
  - director of accreditation
  - director of programmes
  - director of partnerships
  - director of impact
  - director of strategy
  - director of development
  - director of governance
  - director of assessment
  - director of research
  - director of membership
  - director of skills
  - director of credentials
  - director of workforce
  - director of professional development
  - director of innovation
  - director of knowledge
  - director of leadership
  - director of leadership development
  - head of education
  - head of policy
  - head of quality
  - head of learning
  - head of standards
  - head of accreditation
  - head of partnerships
  - head of programmes
  - head of skills
  - head of professional development
  - head of credentials
  - head of membership
title_gate:
