label: Higher Education Leadership
db_path: jobs_he.db
output_prefix: ""

filters:
  minimum_score: 20
  # Salary signal: stated salary >= target awards +salary_bonus; stated salary
  # below floor applies -salary_bonus; no stated salary is treated as neutral.
  # Most senior search-firm listings omit salary, so this is a tiebreaker.
  # Thresholds reflect the actual senior HE leadership market — PVC roles
  # £130k+, Director-of-X at Russell Group £80-120k. A £75k role is not the
  # signal we want to chase.
  salary_floor: 80000
  salary_target: 100000
  # Lower floor used when the role looks remote or hybrid. A £75k role you
  # don't have to relocate for is materially different from £75k requiring
  # a London office, so it shouldn't be penalised the same way. Roles below
  # this remote floor are still penalised — the tradeoff isn't unlimited.
  remote_salary_floor: 70000
  # HE senior leadership is a lower-cadence market than charity — roles are
  # advertised once and recruited over 4-8 weeks. A 24h window leaves most
  # daily reports legitimately empty between waves. Widening to 72h smooths
  # this without making the email feel stale (weekly digest is still 168h).
  daily_window_hours: 72

sources:
  # jobs.ac.uk (observed June 2026): RSS feeds retired and the old job-type
  # taxonomy removed, so /search/<slug> now returns the full unfiltered set
  # (page 1 only) and the old ".j-search-result__title a" selector matches
  # nothing. The working path is the server-rendered keyword search with the
  # query in EVERY request (jobs.ac.uk tracks a stateful per-client "current
  # search" otherwise, so concurrent fetches bleed). Results are newest-first;
  # pageSize is capped at 25 and pages step startIndex by 25. Title cards live
  # in div.j-search-result__result; the title link is the first <a> in
  # .j-search-result__text and points at a stable /job/<ID> URL. Keyword
  # queries are deliberately narrow — the title_gate + scoring do the final
  # filtering, so a little keyword fuzziness is harmless. "director" is broad,
  # so it paginates; the rest fit on one page.
  - name: jobs.ac.uk Director
    url: https://www.jobs.ac.uk/search/?keywords=director&sortOrder=1&pageSize=25&startIndex=1
    selector: ".j-search-result__text > a"
    pages: 3
  - name: jobs.ac.uk Dean
    url: https://www.jobs.ac.uk/search/?keywords=dean&sortOrder=1&pageSize=25&startIndex=1
    selector: ".j-search-result__text > a"
    pages: 2
  - name: jobs.ac.uk Registrar
    url: https://www.jobs.ac.uk/search/?keywords=registrar&sortOrder=1&pageSize=25&startIndex=1
    selector: ".j-search-result__text > a"
  - name: jobs.ac.uk Pro-Vice-Chancellor
    url: https://www.jobs.ac.uk/search/?keywords=pro-vice-chancellor&sortOrder=1&pageSize=25&startIndex=1
    selector: ".j-search-result__text > a"
  - name: THE UniJobs
    url: https://www.timeshighereducation.com/unijobs/listings/united-kingdom/
    selector: ".job-results__title a"
  - name: Peridot Partners
    url: https://www.peridotpartners.co.uk/job-role/education-executive-roles/
    selector: ".card-title a"
  # Odgers Berndtson excluded: vacancies are JavaScript-rendered, not in HTML source
  # Perrett Laver: selector targets vacancy links by href pattern — verify on first run
  - name: Perrett Laver
    url: https://candidates.perrettlaver.com/vacancies/
    selector: "a[href*='/vacancies/']"
  # New HE exec-search firms — selectors are defensive multi-pattern OR-lists
  # because each firm's URL slug is a guess. Watch the per-source panel at
  # the bottom of each email: any source showing 0 links across consecutive
  # runs is likely JS-rendered (like Odgers Berndtson) and can be dropped.
  # Saxton Bampfylde — try the obvious /appointment/, /appointments/ slugs.
  - name: Saxton Bampfylde
    url: https://www.saxbam.com/appointments/
    selector: "a[href*='/appointment/'], a[href*='/appointments/']"
  # Anderson Quigley — broaden to opportunity slug too, in case singular form
  # is used per-vacancy.
  - name: Anderson Quigley
    url: https://www.andersonquigley.com/opportunities/
    selector: "a[href*='/opportunity/'], a[href*='/opportunities/']"
  # Dixon Walter — small WordPress site; try both singular vacancy and
  # generic position slugs.
  - name: Dixon Walter
    url: https://www.dixonwalter.co.uk/vacancies/
    selector: "a[href*='/vacancy/'], a[href*='/position/']"
  # Veredus — public-sector exec search; /job/ and /jobs/ are both plausible
  # detail-page patterns on WordPress installations.
  - name: Veredus
    url: https://www.veredus.co.uk/jobs/
    selector: "a[href*='/job/'], a[href*='/jobs/']"
  # Minerva Search — boutique HE/charity exec search; try position/positions
  # plus a generic search slug fallback.
  - name: Minerva Search
    url: https://minervasearch.com/positions/
    selector: "a[href*='/position/'], a[href*='/positions/'], a[href*='/search/']"

weights:
  executive_bonus: 50
  director_bonus: 30
  permanent_signal: 25
  expertise_signal: 20
  geography_bonus: 20
  # Stronger signal now that the floor/target reflect the real senior market.
  # A role advertising £100k+ is meaningfully different from one advertising
  # £75k, so the gap between Salary Match and Below Target should weigh in.
  salary_bonus: 30
  exclusion_penalty: -60

exec_titles:
  - pro-vice-chancellor
  # Hyphenation varies across job boards: "Pro Vice-Chancellor" (jobs.ac.uk
  # style), "Pro Vice Chancellor" (some exec-search firms), and the fully
  # hyphenated form above. Match all three so the Associate/Deputy variants
  # get the executive bonus regardless of how the source punctuates the title.
  - pro vice-chancellor
  - pro vice chancellor
  - pvc
  - registrar
  - principal
  - provost
  - vice-principal
  - chief executive
  - ceo
  - dean
  - vice-chancellor
  - vice chancellor
  - director of education
  - director of student
  - director of academic
  - director of quality
  - director of learning
  - director of teaching

# Adjacent senior HE titles that don't quite fit exec_titles but should still
# score: faculty leadership (Associate/Pro-Dean) and the broader Director-of-X
# roles common in modern HE (student experience, innovation, knowledge
# exchange, digital learning, leadership development, etc.).
director_titles:
  - associate dean
  - pro-dean
  - faculty pro-dean
  - director of strategy
  - director of innovation
  - director of knowledge exchange
  - director of enterprise
  - director of student experience
  - director of student success
  - director of educational excellence
  - director of leadership
  - director of leadership development
  - director of digital learning
  - director of online learning
  - director of external engagement
  - director of engagement
  - director of research
  - director of access
  - director of widening participation
  - director of partnerships
  - director of policy
  - director of governance
  # Common university-administration directorships. Previously these scored 0
  # from titles and depended entirely on the permanent/expertise/geography
  # signals to clear the minimum_score floor — many senior-search listings
  # omit "permanent" explicitly, so realistic Director-of-X roles were dropped.
  - director of marketing
  - director of communications
  - director of external relations
  - director of people
  - director of human resources
  - director of hr
  - director of finance
  - director of operations
  - director of it
  - director of digital
  - director of information
  - chief operating officer
  - chief information officer
  - chief financial officer
  - university secretary
  - company secretary

title_gate:
  - director
  - pvc
  - dean
  - ceo
  - chief
  - registrar
  - head of
  - principal
  - provost
  - vice-chancellor
  # Unhyphenated variant — without this, "Associate Pro Vice Chancellor" and
  # "Pro Vice Chancellor" (common on jobs.ac.uk and some exec-search firms)
  # would be dropped at the gate before the description is even fetched.
  - vice chancellor
  # "University Secretary" / "Company Secretary" are common UK university
  # leadership roles that would otherwise be dropped — none of the other
  # gate terms match.
  - secretary

# Narrow technical-IC and operational roles only. Bare terms like "developer",
# "estates", "facilities", "security" were previously blanket-excluded, which
# killed legitimate leadership roles whose JDs simply *mention* working with
# the Estates team, data security, or curriculum developers. Use specific
# job-title fragments instead so the substring match against title+description
# only fires when the role itself is operational/IC, not when it's adjacent.
exclusion_terms:
  - software developer
  - software engineer
  - software architect
  - curriculum developer
  - policy developer
  - nurse
  - warehouse
  - technician
  - director of estates
  - head of estates
  - estates manager
  - director of facilities
  - head of facilities
  - facilities manager
  - director of security
  - head of security
  - security officer
  - catering
  - porter
