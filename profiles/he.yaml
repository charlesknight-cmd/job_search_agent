label: Higher Education Leadership
db_path: jobs_he.db
output_prefix: ""

filters:
  minimum_score: 20
  # Salary signal: stated salary >= target awards +15; stated salary below
  # floor penalises -15; no stated salary is treated as neutral. Most senior
  # search-firm listings omit salary, so this is a tiebreaker, not a gate.
  salary_floor: 60000
  salary_target: 65000

sources:
  - name: jobs.ac.uk
    url: https://www.jobs.ac.uk/search/senior-management
    selector: ".j-search-result__title a"
  - name: THE UniJobs
    url: https://www.timeshighereducation.com/unijobs/listings/united-kingdom/
    selector: ".job-results__title a"
  - name: Peridot Partners
    url: https://www.peridotpartners.co.uk/job-role/education-executive-roles/
    selector: ".card-title a"
  # Odgers Berndtson excluded: vacancies are JavaScript-rendered, not in HTML source
  # Perrett Laver: selector targets vacancy links by href pattern — verify on first run
  - name: Perrett Laver
    url: https://candidates.perrettlaver.com/vacancies/
    selector: "a[href*='/vacancies/']"
  # New HE exec-search firms — selectors are best-guess based on each site's
  # public-facing listings page; verify on first run and remove any that
  # return zero matches (likely JS-rendered, like Odgers Berndtson).
  # Saxton Bampfylde — appointments page lists role cards; href pattern is
  # typically /appointment/<slug> on the public site.
  - name: Saxton Bampfylde
    url: https://www.saxbam.com/appointments/
    selector: "a[href*='/appointment/']"
  # Anderson Quigley — opportunities page; href pattern targets vacancy links.
  - name: Anderson Quigley
    url: https://www.andersonquigley.com/opportunities/
    selector: "a[href*='/opportunities/']"
  # Dixon Walter — small WordPress site, vacancy detail pages live under
  # /vacancy/<slug>; this selector targets the link from the listings index.
  - name: Dixon Walter
    url: https://www.dixonwalter.co.uk/vacancies/
    selector: "a[href*='/vacancy/']"
  # Veredus — public-sector exec search; jobs page server-rendered.
  - name: Veredus
    url: https://www.veredus.co.uk/jobs/
    selector: "a[href*='/job/']"
  # Minerva Search — boutique HE/charity exec search; positions page.
  - name: Minerva Search
    url: https://minervasearch.com/positions/
    selector: "a[href*='/position/']"

weights:
  executive_bonus: 50
  director_bonus: 30
  permanent_signal: 25
  expertise_signal: 20
  geography_bonus: 20
  exclusion_penalty: -60

exec_titles:
  - pro-vice-chancellor
  # Hyphenation varies across job boards: "Pro Vice-Chancellor" (jobs.ac.uk
  # style), "Pro Vice Chancellor" (some exec-search firms), and the fully
  # hyphenated form above. Match all three so the Associate/Deputy variants
  # get the executive bonus regardless of how the source punctuates the title.
  - pro vice-chancellor
  - pro vice chancellor
  - pvc
  - registrar
  - principal
  - provost
  - vice-principal
  - chief executive
  - ceo
  - dean
  - vice-chancellor
  - vice chancellor
  - director of education
  - director of student
  - director of academic
  - director of quality
  - director of learning
  - director of teaching

# Adjacent senior HE titles that don't quite fit exec_titles but should still
# score: faculty leadership (Associate/Pro-Dean) and the broader Director-of-X
# roles common in modern HE (student experience, innovation, knowledge
# exchange, digital learning, leadership development, etc.).
director_titles:
  - associate dean
  - pro-dean
  - faculty pro-dean
  - director of strategy
  - director of innovation
  - director of knowledge exchange
  - director of enterprise
  - director of student experience
  - director of student success
  - director of educational excellence
  - director of leadership
  - director of leadership development
  - director of digital learning
  - director of online learning
  - director of external engagement
  - director of engagement
  - director of research
  - director of access
  - director of widening participation
  - director of partnerships
  - director of policy
  - director of governance
  # Common university-administration directorships. Previously these scored 0
  # from titles and depended entirely on the permanent/expertise/geography
  # signals to clear the minimum_score floor — many senior-search listings
  # omit "permanent" explicitly, so realistic Director-of-X roles were dropped.
  - director of marketing
  - director of communications
  - director of external relations
  - director of people
  - director of human resources
  - director of hr
  - director of finance
  - director of operations
  - director of it
  - director of digital
  - director of information
  - chief operating officer
  - chief information officer
  - chief financial officer
  - university secretary
  - company secretary

title_gate:
  - director
  - pvc
  - dean
  - ceo
  - chief
  - registrar
  - head of
  - principal
  - provost
  - vice-chancellor
  # Unhyphenated variant — without this, "Associate Pro Vice Chancellor" and
  # "Pro Vice Chancellor" (common on jobs.ac.uk and some exec-search firms)
  # would be dropped at the gate before the description is even fetched.
  - vice chancellor
  # "University Secretary" / "Company Secretary" are common UK university
  # leadership roles that would otherwise be dropped — none of the other
  # gate terms match.
  - secretary

# Narrow technical-IC and operational roles only. Bare terms like "developer",
# "estates", "facilities", "security" were previously blanket-excluded, which
# killed legitimate leadership roles whose JDs simply *mention* working with
# the Estates team, data security, or curriculum developers. Use specific
# job-title fragments instead so the substring match against title+description
# only fires when the role itself is operational/IC, not when it's adjacent.
exclusion_terms:
  - software developer
  - software engineer
  - software architect
  - curriculum developer
  - policy developer
  - nurse
  - warehouse
  - technician
  - director of estates
  - head of estates
  - estates manager
  - director of facilities
  - head of facilities
  - facilities manager
  - director of security
  - head of security
  - security officer
  - catering
  - porter
