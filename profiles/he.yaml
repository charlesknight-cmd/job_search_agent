label: Higher Education Leadership
db_path: jobs_he.db
output_prefix: ""

filters:
  minimum_score: 20
  # Salary signal: stated salary >= target awards +salary_bonus; stated salary
  # below floor applies -salary_bonus; no stated salary is treated as neutral.
  # Most senior search-firm listings omit salary, so this is a tiebreaker.
  # Thresholds reflect the actual senior HE leadership market — PVC roles
  # £130k+, Director-of-X at Russell Group £80-120k. A £75k role is not the
  # signal we want to chase.
  salary_floor: 80000
  salary_target: 100000
  # Lower floor used when the role looks remote or hybrid. A £75k role you
  # don't have to relocate for is materially different from £75k requiring
  # a London office, so it shouldn't be penalised the same way. Roles below
  # this remote floor are still penalised — the tradeoff isn't unlimited.
  remote_salary_floor: 70000
  # HE senior leadership is a lower-cadence market than charity — roles are
  # advertised once and recruited over 4-8 weeks. A 24h window leaves most
  # daily reports legitimately empty between waves. Widening to 72h smooths
  # this without making the email feel stale (weekly digest is still 168h).
  daily_window_hours: 72

sources:
  # jobs.ac.uk (observed June 2026): RSS feeds retired and the old job-type
  # taxonomy removed, so /search/<slug> now returns the full unfiltered set
  # (page 1 only) and the old ".j-search-result__title a" selector matches
  # nothing. The working path is the server-rendered keyword search with the
  # query in EVERY request (jobs.ac.uk tracks a stateful per-client "current
  # search" otherwise, so concurrent fetches bleed). Results are newest-first;
  # pageSize is capped at 25 and pages step startIndex by 25. Title cards live
  # in div.j-search-result__result; the title link is the first <a> in
  # .j-search-result__text and points at a stable /job/<ID> URL. Keyword
  # queries are deliberately narrow — the title_gate + scoring do the final
  # filtering, so a little keyword fuzziness is harmless. "director" is broad,
  # so it paginates; the rest fit on one page.
  - name: jobs.ac.uk Director
    url: https://www.jobs.ac.uk/search/?keywords=director&sortOrder=1&pageSize=25&startIndex=1
    selector: ".j-search-result__text > a"
    pages: 3
  - name: jobs.ac.uk Dean
    url: https://www.jobs.ac.uk/search/?keywords=dean&sortOrder=1&pageSize=25&startIndex=1
    selector: ".j-search-result__text > a"
    pages: 2
  - name: jobs.ac.uk Registrar
    url: https://www.jobs.ac.uk/search/?keywords=registrar&sortOrder=1&pageSize=25&startIndex=1
    selector: ".j-search-result__text > a"
  - name: jobs.ac.uk Pro-Vice-Chancellor
    url: https://www.jobs.ac.uk/search/?keywords=pro-vice-chancellor&sortOrder=1&pageSize=25&startIndex=1
    selector: ".j-search-result__text > a"
  # Peridot Partners — listing page is server-rendered. Title links sit in an
  # <h2> and point at /jobs/<slug> (the old ".card-title a" class is gone, so
  # the source had been silently dry). Verified June 2026: 8 titles.
  - name: Peridot Partners
    url: https://www.peridotpartners.co.uk/job-role/education-executive-roles/
    selector: "h2 a[href*='/jobs/']"
  # Dixon Walter — server-rendered "stretched link" cards: each role is an
  # <article class="opportunities"> with an empty overlay anchor
  # (a.showcase__link-stretch) plus the title in a sibling <h4>/<span>. The
  # anchor carries the href but no text, so the scraper's card-heading title
  # fallback (extract_link_title) reads the <h4>. Re-enabled June 2026 once
  # that fallback landed.
  - name: Dixon Walter
    url: https://www.dixonwalter.co.uk/opportunities/
    selector: "article.opportunities a.showcase__link-stretch"
  # THE UniJobs (Madgex) — the HTML listing is a JS app, but Madgex still
  # publishes a server-rendered RSS feed at /unijobs/jobsrss/ that honours a
  # Keywords query. format: rss makes the scraper parse <item> title/link
  # instead of a CSS selector. LocationId=164 constrains to the UK (without it
  # the feed floods with international roles); titles arrive as
  # "EMPLOYER: Title". Narrow keyword feeds, like the jobs.ac.uk approach.
  - name: THE UniJobs Director
    url: https://www.timeshighereducation.com/unijobs/jobsrss/?Keywords=director&LocationId=164&countrycode=GB
    format: rss
  - name: THE UniJobs Dean
    url: https://www.timeshighereducation.com/unijobs/jobsrss/?Keywords=dean&LocationId=164&countrycode=GB
    format: rss
  - name: THE UniJobs Registrar
    url: https://www.timeshighereducation.com/unijobs/jobsrss/?Keywords=registrar&LocationId=164&countrycode=GB
    format: rss
  - name: THE UniJobs Vice-Chancellor
    url: https://www.timeshighereducation.com/unijobs/jobsrss/?Keywords=vice-chancellor&LocationId=164&countrycode=GB
    format: rss
  # Minerva Search — the /current-opportunities/ list IS in the server HTML
  # (each role links to /current-opportunities/<slug>/), it was just behind a
  # different path than first probed. The anchor text carries a sector-category
  # prefix (e.g. "Higher Education …") which is harmless noise; the title_gate
  # still matches the leadership terms within it.
  - name: Minerva Search
    url: https://www.minervasearch.com/current-opportunities/
    selector: "a[href*='/current-opportunities/']"
  # Veredus — public-sector exec search on WordPress + WP Job Manager. The HTML
  # listing is JS ("Load more" AJAX, behind Cloudflare Turnstile), but the
  # plugin still publishes a server-rendered jobs feed (post_type=job_listing).
  # Detail links are /job/<slug>/. Surfaces senior interim roles (e.g.
  # "Interim COO & Registrar").
  - name: Veredus
    url: https://www.veredus.co.uk/?post_type=job_listing&feed=rss2
    format: rss
  #
  # --- Excluded HE exec-search firms (audited June 2026) ---
  # The following still render their vacancy lists client-side (JavaScript) with
  # no server-rendered feed or readable endpoint found, so httpx + BeautifulSoup
  # sees an empty shell — same root cause as Odgers Berndtson. Re-adding any of
  # them needs a headless-browser fetch path or their underlying JSON/AJAX
  # endpoint (leads noted below for a future pass).
  #   - Odgers Berndtson — JS-rendered (long-standing exclusion).
  #   - Perrett Laver — vacancies moved to a plusportal.perrettlaver.com SPA;
  #     the marketing site 403s automated requests.
  #   - Saxton Bampfylde (saxbam.com) — WordPress, but wp-json exposes only a
  #     'people' post type; roles load via /wp-admin/admin-ajax.php (action not
  #     yet identified). No jobs feed or REST collection found.
  #   - Anderson Quigley (andersonquigley.com/apply/) — roles load via JS;
  #     server HTML has ~750 chars of text and no role links.
  #   (Veredus was here too — re-enabled above via its WP Job Manager jobs feed.)

weights:
  executive_bonus: 50
  director_bonus: 30
  permanent_signal: 25
  expertise_signal: 20
  geography_bonus: 20
  # Stronger signal now that the floor/target reflect the real senior market.
  # A role advertising £100k+ is meaningfully different from one advertising
  # £75k, so the gap between Salary Match and Below Target should weigh in.
  salary_bonus: 30
  exclusion_penalty: -60

exec_titles:
  - pro-vice-chancellor
  # Hyphenation varies across job boards: "Pro Vice-Chancellor" (jobs.ac.uk
  # style), "Pro Vice Chancellor" (some exec-search firms), and the fully
  # hyphenated form above. Match all three so the Associate/Deputy variants
  # get the executive bonus regardless of how the source punctuates the title.
  - pro vice-chancellor
  - pro vice chancellor
  - pvc
  - registrar
  - principal
  - provost
  - vice-principal
  - chief executive
  - ceo
  - dean
  - vice-chancellor
  - vice chancellor
  - director of education
  - director of student
  - director of academic
  - director of quality
  - director of learning
  - director of teaching

# Adjacent senior HE titles that don't quite fit exec_titles but should still
# score: faculty leadership (Associate/Pro-Dean) and the broader Director-of-X
# roles common in modern HE (student experience, innovation, knowledge
# exchange, digital learning, leadership development, etc.).
director_titles:
  - associate dean
  - pro-dean
  - faculty pro-dean
  - director of strategy
  - director of innovation
  - director of knowledge exchange
  - director of enterprise
  - director of student experience
  - director of student success
  - director of educational excellence
  - director of leadership
  - director of leadership development
  - director of digital learning
  - director of online learning
  - director of external engagement
  - director of engagement
  - director of research
  - director of access
  - director of widening participation
  - director of partnerships
  - director of policy
  - director of governance
  # Common university-administration directorships. Previously these scored 0
  # from titles and depended entirely on the permanent/expertise/geography
  # signals to clear the minimum_score floor — many senior-search listings
  # omit "permanent" explicitly, so realistic Director-of-X roles were dropped.
  - director of marketing
  - director of communications
  - director of external relations
  - director of people
  - director of human resources
  - director of hr
  - director of finance
  - director of operations
  - director of it
  - director of digital
  - director of information
  - chief operating officer
  - chief information officer
  - chief financial officer
  - university secretary
  - company secretary

title_gate:
  - director
  - pvc
  - dean
  - ceo
  - chief
  - registrar
  - head of
  - principal
  - provost
  - vice-chancellor
  # Unhyphenated variant — without this, "Associate Pro Vice Chancellor" and
  # "Pro Vice Chancellor" (common on jobs.ac.uk and some exec-search firms)
  # would be dropped at the gate before the description is even fetched.
  - vice chancellor
  # "University Secretary" / "Company Secretary" are common UK university
  # leadership roles that would otherwise be dropped — none of the other
  # gate terms match.
  - secretary

# Narrow technical-IC and operational roles only. Bare terms like "developer",
# "estates", "facilities", "security" were previously blanket-excluded, which
# killed legitimate leadership roles whose JDs simply *mention* working with
# the Estates team, data security, or curriculum developers. Use specific
# job-title fragments instead so the substring match against title+description
# only fires when the role itself is operational/IC, not when it's adjacent.
exclusion_terms:
  - software developer
  - software engineer
  - software architect
  - curriculum developer
  - policy developer
  - nurse
  - warehouse
  - technician
  - director of estates
  - head of estates
  - estates manager
  - director of facilities
  - head of facilities
  - facilities manager
  - director of security
  - head of security
  - security officer
  - catering
  - porter

# Geography gate (optional). Matched as substrings against the listing card's
# employer + location text — never the description — before the detail page is
# fetched, so overseas roles cost nothing and cannot reach the report. jobs.ac.uk
# carries no location facet in its server-rendered search (the facets are JS), so
# filtering has to happen on our side; it does put the employer and a "Location:"
# line on every result card, which is what this matches. A second, authoritative
# check runs on the detail page: a schema.org posting declaring a non-UK
# addressCountry is dropped too (see is_overseas_posting).
#
# Country and territory names only. Town names are deliberately excluded — they
# collide with UK places (Perth, Birmingham, Newcastle all exist twice) — which
# is why a role advertised solely by an unfamiliar town and whose detail page
# carries no JSON-LD can still slip through. Observed live June/August 2026:
# University of Auckland, British University of Bahrain, Hang Seng University of
# Hong Kong and Xi'an Jiaotong-Liverpool all advertise senior roles on jobs.ac.uk.
location_exclude:
  - new zealand
  - australia
  - hong kong
  - macau
  - singapore
  - china
  - taiwan
  - japan
  - south korea
  - malaysia
  - thailand
  - vietnam
  - indonesia
  - philippines
  - india
  - pakistan
  - bangladesh
  - sri lanka
  - bahrain
  - qatar
  - kuwait
  - oman
  - united arab emirates
  - abu dhabi
  - dubai
  - saudi arabia
  - jordan
  - lebanon
  - turkey
  - egypt
  - morocco
  - nigeria
  - ghana
  - kenya
  - tanzania
  - uganda
  - rwanda
  - ethiopia
  - south africa
  - botswana
  - namibia
  - zimbabwe
  - mauritius
  - united states
  - u.s.a
  - canada
  - mexico
  - brazil
  - chile
  - argentina
  - colombia
  - germany
  - france
  - netherlands
  - belgium
  - luxembourg
  - spain
  - portugal
  - italy
  - switzerland
  - austria
  - sweden
  - norway
  - denmark
  - finland
  - iceland
  - poland
  - czech
  - hungary
  - romania
  - bulgaria
  - croatia
  - greece
  - cyprus
  - malta
  # Republic of Ireland only — "ireland" alone would match Northern Ireland,
  # which is in the UK.
  - republic of ireland
  - kazakhstan
  - uzbekistan
  - azerbaijan
  - fiji

# Title fragments that disqualify an executive/director title match. exec_titles
# are matched as substrings, and "principal" has to stay in that list because it
# is the head of a Scottish university — but it also fired on "Principal
# Lecturer", "Principal Product Manager" and "Principal Academic Partnership
# Lead", handing each the full +50 executive bonus and ranking them above real
# directorships. These phrases are stripped from the title before matching, so a
# genuine compound title ("Deputy Principal and Dean") is unaffected.
title_blockers:
  - principal lecturer
  - principal teaching fellow
  - principal research fellow
  - principal fellow
  - principal investigator
  - principal academic
  - principal engineer
  - principal scientist
  - principal analyst
  - principal consultant
  - principal developer
  - principal technician
  - principal product manager
  - principal product
  - principal software
  - principal data
  - principal designer
  - principal architect

# Genuine leadership titles that contain one of the blockers above and must
# survive it — "Vice-Principal Academic" contains "principal academic". These
# are masked before blockers are stripped, then restored.
title_blocker_exceptions:
  - vice-principal
  - vice principal
  - deputy principal
  - depute principal
  - principal and vice-chancellor
  - principal and vice chancellor
