name: Job Search Agent

on:
  schedule:
    - cron: '15 9 * * *'    # Daily at 09:15 UTC — off the contended top-of-hour slot
    - cron: '0 8 * * 1'     # Monday at 8 AM — weekly digest
  workflow_dispatch:
    inputs:
      weekly:
        description: 'Generate weekly digest instead of daily report'
        required: false
        default: 'false'
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  he-agent:
    name: Higher Education Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Previous DB
        uses: dawidd6/action-download-artifact@v3
        with:
          name: job-databases-he
          if_no_artifact_found: warn

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run HE Agent
        run: |
          if [ "${{ github.event.schedule }}" = "0 8 * * 1" ] || [ "${{ inputs.weekly }}" = "true" ]; then
            python job_search_agent.py --profile he --weekly
          else
            python job_search_agent.py --profile he
          fi

      - name: Send HE Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "HE Perform: Higher Education Update"
          to: charles.knight@gmail.com
          from: charles.knight@gmail.com
          html_body: file://new_jobs_report.html

      - name: Notify on Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ HE Perform: HE Agent FAILED"
          to: charles.knight@gmail.com
          from: charles.knight@gmail.com
          body: |
            The HE job search agent failed.
            Workflow: ${{ github.workflow }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Commit: ${{ github.sha }}

      - name: Upload Updated DB
        uses: actions/upload-artifact@v4
        with:
          name: job-databases-he
          path: "*.db"
          overwrite: true

