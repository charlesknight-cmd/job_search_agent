name: job-search-agent

on:
  schedule:
    - cron: '15 6 * * *'      # Daily 06:15 UTC
    - cron: '45 15 * * *'     # Daily 15:45 UTC
    - cron: '0 8 * * 5'       # Friday 08:00 UTC — weekly digest
  workflow_dispatch:
    inputs:
      weekly:
        description: 'Generate weekly digest'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      profile:
        description: 'Which profile to run'
        required: false
        default: 'he'
        type: choice
        options: ['he', 'charity']

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- THE MEMORY STEP: Download database from the last successful run ---
      - name: Download previous database
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: job-search-agent.yml
          name: job-databases
          if_no_artifact_found: warn

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Detect if we should run in "weekly" mode based on the Friday schedule or manual input
      - name: Set run mode
        id: mode
        run: |
          IS_FRIDAY_CRON="false"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DAY=$(date -u +%u)
            [ "$DAY" = "5" ] && IS_FRIDAY_CRON="true"
          fi
          if [ "$IS_FRIDAY_CRON" = "true" ] || [ "${{ github.event.inputs.weekly }}" = "true" ]; then
            echo "weekly=--weekly" >> "$GITHUB_OUTPUT"
          else
            echo "weekly=" >> "$GITHUB_OUTPUT"
          fi

      # ── Higher Education Run ──────────────────────────────────────────────────
      - name: Run HE search
        if: github.event.inputs.profile == 'he' || github.event.inputs.profile == '' || github.event_name == 'schedule'
        run: python job_search_agent.py --profile he ${{ steps.mode.outputs.weekly }}

      - name: Email HE Report
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: charles.knight@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "HE Perform: Job Update (${{ github.run_started_at }})"
          to: charles.knight@gmail.com
          from: charles.knight@gmail.com
          # Points to the HTML report generated by the script
          html_body: file://new_jobs_report.html
          ignore_missing_files: true

      # ── Charity CEO Run ──────────────────────────────────────────────────────
      - name: Run Charity search
        if: github.event.inputs.profile == 'charity'
        run: python job_search_agent.py --profile charity ${{ steps.mode.outputs.weekly }}

      - name: Email Charity Report
        if: success() && github.event.inputs.profile == 'charity'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: charles.knight@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Charity CEO: Job Update (${{ github.run_started_at }})"
          to: charles.knight@gmail.com
          from: charles.knight@gmail.com
          html_body: file://charity_new_jobs_report.html
          ignore_missing_files: true

      # ── Save Databases for next time ─────────────────────────────────────────
      - name: Upload databases
        uses: actions/upload-artifact@v4
        with:
          name: job-databases
          path: |
            *.db
            *.html
