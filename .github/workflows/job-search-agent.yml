name: job-search-agent

on:
  schedule:
    - cron: '15 6 * * *'      # Daily 06:15 UTC
    - cron: '45 15 * * *'     # Daily 15:45 UTC
    - cron: '0 8 * * 5'       # Friday 08:00 UTC — weekly digest
  workflow_dispatch:
    inputs:
      weekly:
        description: 'Generate weekly digest instead of daily scrape'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      profile:
        description: 'Which profile to run (he, charity, or both)'
        required: false
        default: 'both'
        type: choice
        options: ['both', 'he', 'charity']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      # Detect weekly-digest mode
      - name: Set run mode
        id: mode
        run: |
          IS_FRIDAY_CRON="false"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DAY=$(date -u +%u)
            HOUR=$(date -u +%H)
            [ "$DAY" = "5" ] && [ "$HOUR" = "08" ] && IS_FRIDAY_CRON="true"
          fi
          WEEKLY_INPUT="${{ github.event.inputs.weekly }}"
          if [ "$IS_FRIDAY_CRON" = "true" ] || [ "$WEEKLY_INPUT" = "true" ]; then
            echo "weekly=true" >> "$GITHUB_OUTPUT"
          else
            echo "weekly=false" >> "$GITHUB_OUTPUT"
          fi
          PROFILE="${{ github.event.inputs.profile }}"
          echo "profile=${PROFILE:-both}" >> "$GITHUB_OUTPUT"

      # ── HE daily scrape ──────────────────────────────────────────────────────
      - name: Run HE daily scrape
        if: steps.mode.outputs.weekly == 'false' && steps.mode.outputs.profile != 'charity'
        run: python job_search_agent.py --profile he

      - name: Email HE new-jobs report
        if: steps.mode.outputs.weekly == 'false' && steps.mode.outputs.profile != 'charity'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: charles.knight@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "New HE Jobs (${{ github.run_started_at }})"
          to: charles.knight@gmail.com
          from: charles.knight@gmail.com
          html_body: file://new_jobs_report.html

      # ── Charity CEO daily scrape ─────────────────────────────────────────────
      - name: Run Charity CEO daily scrape
        if: steps.mode.outputs.weekly == 'false' && steps.mode.outputs.profile != 'he'
        run: python job_search_agent.py --profile charity

      - name: Email Charity CEO new-jobs report
        if: steps.mode.outputs.weekly == 'false' && steps.mode.outputs.profile != 'he'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: charles.knight@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "New Charity CEO Jobs (${{ github.run_started_at }})"
          to: charles.knight@gmail.com
          from: charles.knight@gmail.com
          html_body: file://charity_new_jobs_report.html

      # ── Upload all artifacts ─────────────────────────────────────────────────
      - name: Upload daily artifacts
        if: steps.mode.outputs.weekly == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: latest-job-reports
          path: |
            latest_report.txt
            new_jobs_report.html
            latest_jobs.csv
            jobs_he.db
            charity_latest_report.txt
            charity_new_jobs_report.html
            charity_latest_jobs.csv
            charity_jobs.db

      # ── HE weekly digest ─────────────────────────────────────────────────────
      - name: Run HE weekly digest
        if: steps.mode.outputs.weekly == 'true' && steps.mode.outputs.profile != 'charity'
        run: python job_search_agent.py --weekly --profile he

      - name: Email HE weekly digest
        if: steps.mode.outputs.weekly == 'true' && steps.mode.outputs.profile != 'charity'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: charles.knight@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Weekly HE Digest — Top 10 this week"
          to: charles.knight@gmail.com
          from: charles.knight@gmail.com
          html_body: file://weekly_digest.html

      # ── Charity CEO weekly digest ────────────────────────────────────────────
      - name: Run Charity CEO weekly digest
        if: steps.mode.outputs.weekly == 'true' && steps.mode.outputs.profile != 'he'
        run: python job_search_agent.py --weekly --profile charity

      - name: Email Charity CEO weekly digest
        if: steps.mode.outputs.weekly == 'true' && steps.mode.outputs.profile != 'he'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: charles.knight@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Weekly Charity CEO Digest — Top 10 this week"
          to: charles.knight@gmail.com
          from: charles.knight@gmail.com
          html_body: file://charity_weekly_digest.html

      # ── Upload weekly artifacts ──────────────────────────────────────────────
      - name: Upload weekly artifacts
        if: steps.mode.outputs.weekly == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-digests
          path: |
            weekly_digest.html
            charity_weekly_digest.html
