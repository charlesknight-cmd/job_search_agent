name: Job Search Agent

on:
  schedule:
    - cron: '0 9 * * *' # Runs daily at 9 AM
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  he-agent:
    name: Higher Education Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Previous DB
        uses: dawidd6/action-download-artifact@v3
        with:
          name: job-databases
          if_no_artifact_found: warn

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run HE Agent
        run: python job_search_agent.py --profile he

      - name: Send HE Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "HE Perform: Higher Education Update"
          to: charles.knight@gmail.com
          from: charles.knight@gmail.com
          html_body: file://new_jobs_report.html
          ignore_missing_files: true

      - name: Upload Updated DB
        uses: actions/upload-artifact@v4
        with:
          name: job-databases
          path: "*.db"

  charity-agent:
    name: Charity CEO Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Previous DB
        uses: dawidd6/action-download-artifact@v3
        with:
          name: job-databases
          if_no_artifact_found: warn

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Charity Agent
        run: python job_search_agent.py --profile charity

      - name: Send Charity Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "HE Perform: Charity CEO Update"
          to: charles.knight@gmail.com
          from: charles.knight@gmail.com
          html_body: file://charity_new_jobs_report.html
          ignore_missing_files: true

      - name: Upload Updated DB
        uses: actions/upload-artifact@v4
        with:
          name: job-databases
          path: "*.db"
          overwrite: true
