name: job-search-agent

on:
  schedule:
    - cron: '15 6 * * *'      # Daily 06:15 UTC
    - cron: '45 15 * * *'     # Daily 15:45 UTC
    - cron: '0 8 * * 5'       # Friday 08:00 UTC — weekly digest
  workflow_dispatch:
    inputs:
      weekly:
        description: 'Generate weekly digest instead of daily scrape'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      # Determine whether this is a weekly-digest run:
      # true if it's Friday's scheduled cron OR --weekly was passed via workflow_dispatch
      - name: Set run mode
        id: mode
        run: |
          IS_FRIDAY_CRON="false"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DAY=$(date -u +%u)   # 1=Mon … 5=Fri … 7=Sun
            HOUR=$(date -u +%H)
            [ "$DAY" = "5" ] && [ "$HOUR" = "08" ] && IS_FRIDAY_CRON="true"
          fi
          WEEKLY_INPUT="${{ github.event.inputs.weekly }}"
          if [ "$IS_FRIDAY_CRON" = "true" ] || [ "$WEEKLY_INPUT" = "true" ]; then
            echo "weekly=true" >> "$GITHUB_OUTPUT"
          else
            echo "weekly=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Daily scrape ──────────────────────────────────────────────────────────
      - name: Run daily scrape
        if: steps.mode.outputs.weekly == 'false'
        run: python job_search_agent.py

      - name: Upload daily artifacts
        if: steps.mode.outputs.weekly == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: latest-job-report
          path: |
            latest_report.txt
            new_jobs_report.txt
            new_jobs_report.html
            latest_jobs.csv
            jobs.db

      - name: Email daily new-jobs report
        if: steps.mode.outputs.weekly == 'false'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: charles.knight@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "New Jobs (${{ github.run_started_at }})"
          to: charles.knight@gmail.com
          from: charles.knight@gmail.com
          html_body: file://new_jobs_report.html

      # ── Weekly digest (Fridays) ───────────────────────────────────────────────
      - name: Run weekly digest
        if: steps.mode.outputs.weekly == 'true'
        run: python job_search_agent.py --weekly

      - name: Upload weekly digest artifact
        if: steps.mode.outputs.weekly == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-digest
          path: weekly_digest.html

      - name: Email weekly digest
        if: steps.mode.outputs.weekly == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: charles.knight@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Weekly Job Digest — Top 10 this week"
          to: charles.knight@gmail.com
          from: charles.knight@gmail.com
          html_body: file://weekly_digest.html
