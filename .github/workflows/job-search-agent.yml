name: job-search-agent

on:
  schedule:
    - cron: '15 6 * * *'   # morning run, UTC
    - cron: '45 15 * * *'  # afternoon run, UTC
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        run: python job_search_agent.py

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: latest-job-report
          path: |
            latest_report.txt
            latest_jobs.csv
            jobs.db

      - name: Email report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: charles.knight@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Job Search Report – ${{ github.run_started_at }}"
          to: charles.knight@gmail.com
          from: charles.knight@gmail.com
          body: file://latest_report.txt
